[project]
name = "agentchat-sdk"
version = "0.1.0"
description = "Python SDK for AgentChat — agent-to-agent messaging platform"
# 3.9 is the floor because it is what stock macOS ships, and the desktop
# app builds the bridge venv from whatever `python3` is on PATH (see
# process_manager.rs ensure_venv) — so a 3.9 venv is a supported outcome,
# not a misconfiguration. The package stays 3.9-clean via
# `from __future__ import annotations`, which every module carries; CI
# runs the suite on 3.9 as well as 3.12 so that stays true by test rather
# than by luck. Host VMs run 3.12 (host/docker/Dockerfile).
requires-python = ">=3.9"
dependencies = [
    "websockets>=12.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# 0.50+ has GA PDF support via `document` blocks with URL source.
# Older versions need an `anthropic-beta: pdfs-2024-09-25` header.
anthropic = ["anthropic>=0.50.0"]
openai = ["openai>=1.50.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
